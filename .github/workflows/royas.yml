name: royas

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Install requests module
        run: python3 -m pip install requests

      - name: Execute Python script for royatv
        run: python3 platforms/royatv.py > platforms/links/royatv.m3u8
        
      - name: Execute Python script for royasport
        run: python3 platforms/royasport.py > platforms/links/royasport.m3u8

      - name: Execute Python script for royanews
        run: python3 platforms/royanews.py > platforms/links/royanews.m3u8

      - name: commit & push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git commit -m "updated streams $(date +'%Y-%m-%d %H:%M:%S')" || echo "No updated streams"
          git push
