name: royas

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

# Botun depoya commit & push yapabilmesi için gerekli yazma izni
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python3 -m pip install requests

      - name: Execute Python script for royas
        run: python3 platforms/roya.py

      - name: commit & push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git commit -m "updated streams $(date +'%Y-%m-%d %H:%M:%S')" || echo "No updated streams"
          git push
